<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">CTF reversing workflow</title><desc id="desc">Triage leads to stored, checked or computed flag branches, then a model and verification in the original unpatched program.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#75e0ba"/></marker></defs><rect width="1100" height="650" fill="#0a101b"/><text x="30" y="40" font-family="monospace" font-size="25" fill="#75e0ba">REVERSE / CLASSIFY BEFORE YOU DECODE</text><rect x="345" y="75" width="410" height="100" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="361" y="104" font-family="monospace" font-size="19" fill="#75e0ba">TRIAGE</text><text x="361" y="135" font-family="monospace" font-size="15" fill="#d9e7ef">Format / architecture / runtime / input</text><rect x="30" y="245" width="310" height="120" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="46" y="274" font-family="monospace" font-size="19" fill="#75e0ba">STORED</text><text x="46" y="305" font-family="monospace" font-size="15" fill="#d9e7ef">Strings / resources / blobs</text><text x="46" y="330" font-family="monospace" font-size="15" fill="#d9e7ef">Read bytes, inspect live xrefs</text><rect x="395" y="245" width="310" height="120" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="411" y="274" font-family="monospace" font-size="19" fill="#75e0ba">CHECKED</text><text x="411" y="305" font-family="monospace" font-size="15" fill="#d9e7ef">Input -&gt; transform -&gt; compare</text><text x="411" y="330" font-family="monospace" font-size="15" fill="#d9e7ef">Invert exact widths and order</text><rect x="760" y="245" width="310" height="120" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="776" y="274" font-family="monospace" font-size="19" fill="#75e0ba">COMPUTED</text><text x="776" y="305" font-family="monospace" font-size="15" fill="#d9e7ef">Actions -&gt; state -&gt; decrypt</text><text x="776" y="330" font-family="monospace" font-size="15" fill="#d9e7ef">Recover key-producing state</text><path d="M550 175 V210 H185 V245" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 175 V210 H550 V245" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 175 V210 H915 V245" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="425" width="580" height="95" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="276" y="454" font-family="monospace" font-size="19" fill="#75e0ba">MODEL AND COMPARE</text><text x="276" y="485" font-family="monospace" font-size="15" fill="#d9e7ef">Known trace -&gt; reproduced intermediate bytes</text><path d="M185 365 V395 H550 V425" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 365 V395 H550 V425" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><path d="M915 365 V395 H550 V425" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 520 V550" fill="none" stroke="#75e0ba" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="550" width="580" height="70" rx="8" fill="#142132" stroke="#f7b578" stroke-width="2"/><text x="276" y="579" font-family="monospace" font-size="19" fill="#f7b578">VERIFY ORIGINAL PROGRAM</text><text x="276" y="610" font-family="monospace" font-size="15" fill="#d9e7ef">Recovered input reaches actual success</text></svg>