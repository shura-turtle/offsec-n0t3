<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Ghidra conceptual CodeBrowser layout</title><desc id="desc">Original annotated diagram, not a screenshot. Symbol Tree at left, assembly Listing center, Decompiler right, data types and console below.</desc><rect width="1100" height="680" fill="#0a101b"/><text x="30" y="39" font-family="monospace" font-size="25" fill="#75e0ba">GHIDRA / CONCEPTUAL CODEBROWSER MAP</text><text x="30" y="68" font-family="monospace" font-size="16" fill="#a6b4c7">Annotated layout diagram. Not a captured screenshot. Docking varies.</text><rect x="30" y="100" width="225" height="350" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="46" y="129" font-family="monospace" font-size="19" fill="#75e0ba">1  SYMBOL TREE</text><text x="46" y="160" font-family="monospace" font-size="15" fill="#d9e7ef">Functions / imports</text><text x="46" y="185" font-family="monospace" font-size="15" fill="#d9e7ef">Exports / labels</text><text x="46" y="210" font-family="monospace" font-size="15" fill="#d9e7ef"></text><text x="46" y="235" font-family="monospace" font-size="15" fill="#d9e7ef">Start with anchors,</text><text x="46" y="260" font-family="monospace" font-size="15" fill="#d9e7ef">not every function.</text><rect x="275" y="100" width="380" height="350" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="291" y="129" font-family="monospace" font-size="19" fill="#75e0ba">2  LISTING</text><text x="291" y="160" font-family="monospace" font-size="15" fill="#d9e7ef">Addresses / raw bytes</text><text x="291" y="185" font-family="monospace" font-size="15" fill="#d9e7ef">Assembly / data / xrefs</text><text x="291" y="210" font-family="monospace" font-size="15" fill="#d9e7ef"></text><text x="291" y="235" font-family="monospace" font-size="15" fill="#d9e7ef">Validate widths, jumps,</text><text x="291" y="260" font-family="monospace" font-size="15" fill="#d9e7ef">and real operand loads.</text><text x="291" y="285" font-family="monospace" font-size="15" fill="#d9e7ef"></text><text x="291" y="310" font-family="monospace" font-size="15" fill="#d9e7ef">G: jump   L: label</text><text x="291" y="335" font-family="monospace" font-size="15" fill="#d9e7ef">Right click: references</text><rect x="675" y="100" width="395" height="350" rx="8" fill="#142132" stroke="#f7b578" stroke-width="2"/><text x="691" y="129" font-family="monospace" font-size="19" fill="#f7b578">3  DECOMPILER</text><text x="691" y="160" font-family="monospace" font-size="15" fill="#d9e7ef">Approximate C-like view</text><text x="691" y="185" font-family="monospace" font-size="15" fill="#d9e7ef">Rename / retype variables</text><text x="691" y="210" font-family="monospace" font-size="15" fill="#d9e7ef"></text><text x="691" y="235" font-family="monospace" font-size="15" fill="#d9e7ef">input -&gt; transform -&gt; compare</text><text x="691" y="260" font-family="monospace" font-size="15" fill="#d9e7ef"></text><text x="691" y="285" font-family="monospace" font-size="15" fill="#d9e7ef">Check surprising logic</text><text x="691" y="310" font-family="monospace" font-size="15" fill="#d9e7ef">against the Listing.</text><rect x="30" y="470" width="225" height="140" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="46" y="499" font-family="monospace" font-size="19" fill="#75e0ba">4  DATA TYPES</text><text x="46" y="530" font-family="monospace" font-size="15" fill="#d9e7ef">Structures / arrays</text><text x="46" y="555" font-family="monospace" font-size="15" fill="#d9e7ef">Enums / prototypes</text><rect x="275" y="470" width="380" height="140" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="291" y="499" font-family="monospace" font-size="19" fill="#75e0ba">5  GRAPH / CALL TREE</text><text x="291" y="530" font-family="monospace" font-size="15" fill="#d9e7ef">Branch paths / relationships</text><text x="291" y="555" font-family="monospace" font-size="15" fill="#d9e7ef">Indirect edges may be missing</text><rect x="675" y="470" width="395" height="140" rx="8" fill="#142132" stroke="#75e0ba" stroke-width="2"/><text x="691" y="499" font-family="monospace" font-size="19" fill="#75e0ba">6  CONSOLE / SCRIPTS</text><text x="691" y="530" font-family="monospace" font-size="15" fill="#d9e7ef">Local output / Script Manager</text><text x="691" y="555" font-family="monospace" font-size="15" fill="#d9e7ef">Save project annotations</text><text x="30" y="650" font-family="monospace" font-size="16" fill="#a6b4c7">Evidence route: string -&gt; xrefs -&gt; validator -&gt; exact bytes -&gt; original-program proof</text></svg>